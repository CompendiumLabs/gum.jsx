<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>gum.jsx test report</title>
<style>
{{fonts}}
  :root {
    --bg: #1a1a1a; --fg: #ddd; --muted: #999; --faint: #888;
    --card: #222; --border: #333; --code-bg: #1d1d1d; --code-fg: #bbb;
    --pass: #6c6; --pass-bg: #1d3a1d; --fail: #e66; --fail-bg: #3a1d1d; --fail-border: #a44;
  }
  [data-theme="light"] {
    --bg: #f4f4f4; --fg: #222; --muted: #666; --faint: #777;
    --card: #fff; --border: #ddd; --code-bg: #f7f7f7; --code-fg: #444;
    --pass: #2a7; --pass-bg: #e3f5ea; --fail: #c33; --fail-bg: #fbe5e5; --fail-border: #d88;
  }
  [data-theme="dark"] .theme-light { display: none; }
  [data-theme="light"] .theme-dark { display: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; }
  h2 {
    font-size: 1.1rem; font-weight: 600; margin: 2rem 0 1rem;
    padding-bottom: 0.4rem; border-bottom: 1px solid var(--border);
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  .summary { color: var(--muted); margin-bottom: 1rem; }
  .summary .pass { color: var(--pass); }
  .summary .fail { color: var(--fail); }
  .toggle {
    background: var(--card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 999px; padding: 0.35rem 0.9rem; font-size: 0.85rem; cursor: pointer;
    font-family: inherit;
  }
  .toggle:hover { border-color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .card:hover { border-color: var(--muted); box-shadow: 0 0.35rem 1.2rem #0002; transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--pass); outline-offset: 2px; }
  .card.fail { border-color: var(--fail-border); }
  .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border);
  }
  .name {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.85rem;
  }
  .status {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
    padding: 0.15rem 0.5rem; border-radius: 999px;
  }
  .status.pass { background: var(--pass-bg); color: var(--pass); }
  .status.fail { background: var(--fail-bg); color: var(--fail); }
  .controls { display: flex; align-items: center; gap: 0.75rem; }

  /* code/image switch */
  .switch { display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track {
    width: 1.7rem; height: 0.95rem; border-radius: 999px; position: relative;
    background: var(--border); transition: background 0.15s;
  }
  .switch .track::after {
    content: ''; position: absolute; top: 0.12rem; left: 0.12rem;
    width: 0.7rem; height: 0.7rem; border-radius: 50%;
    background: var(--card); transition: transform 0.15s;
  }
  .switch input:checked + .track { background: var(--pass); }
  .switch input:checked + .track::after { transform: translateX(0.75rem); }
  .switch-label { font-size: 0.7rem; color: var(--faint); }

  /* Summary cards are image-only and stay a consistent height. */
  .card-view { height: 18rem; display: flex; flex-direction: column; overflow: hidden; }
  .image {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.5rem;
    align-items: center; justify-content: center;
    padding: 1rem;
  }
  .image svg { width: auto; height: auto; max-width: 100%; max-height: 100%; min-height: 0; }
  /* a strict failure still renders: the reason sits above what it drew */
  .image .error { flex: none; padding: 0; text-align: center; }
  .error {
    color: var(--fail); padding: 1rem;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.8rem; white-space: pre-wrap; word-break: break-word;
  }

  /* shiki dual-theme output: pick the palette matching the page theme */
  .code pre {
    margin: 0; padding: 0.75rem 1rem; height: 100%;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.9rem; line-height: 1.55; tab-size: 4;
    white-space: pre-wrap; word-break: break-word;
    background: var(--code-bg) !important;
  }
  [data-theme="dark"] .shiki, [data-theme="dark"] .shiki span { color: var(--shiki-dark); }
  [data-theme="light"] .shiki, [data-theme="light"] .shiki span { color: var(--shiki-light); }

  /* Large image/code dialog shared by every card. */
  .modal {
    width: min(1100px, calc(100vw - 3rem));
    height: min(850px, calc(100vh - 3rem));
    max-width: none; max-height: none; margin: auto; padding: 0;
    color: var(--fg); background: var(--card);
    border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 1rem 4rem #0008;
  }
  .modal[open] { display: flex; flex-direction: column; }
  .modal::backdrop { background: #000a; backdrop-filter: blur(2px); }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    flex: none; padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--border);
  }
  .modal-view { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .modal-images { display: flex; flex: 1; min-width: 0; min-height: 0; }
  .modal .image { width: 100%; height: 100%; padding: 2rem; }
  .modal .image svg { width: 100%; height: 100%; min-height: 0; }
  .modal .code { display: none; flex: 1; min-width: 0; min-height: 0; overflow: auto; }
  .modal.show-code .modal-images { display: none; }
  .modal.show-code .code { display: block; }
  .close {
    width: 1.8rem; height: 1.8rem; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); cursor: pointer;
    font: 1.25rem/1 inherit;
  }
  .close:hover { color: var(--fg); background: var(--border); }
  .close:focus-visible { outline: 2px solid var(--pass); outline-offset: 1px; }

  @media (max-width: 600px) {
    body { padding: 1rem; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .modal { width: calc(100vw - 1rem); height: calc(100vh - 1rem); }
    .modal .image { padding: 1rem; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>gum.jsx test report</h1>
    <p class="summary">{{summary}}</p>
  </div>
  <button class="toggle" id="toggle" type="button"></button>
</header>
{{sections}}
<dialog class="modal" id="example-modal" aria-labelledby="modal-name">
  <div class="modal-head">
    <span class="name" id="modal-name"></span>
    <span class="controls">
      <label class="switch" title="show code"><input type="checkbox" id="show-code"><span class="track"></span><span class="switch-label">code</span></label>
      <span class="status" id="modal-status"></span>
      <button class="close" id="modal-close" type="button" aria-label="close">&times;</button>
    </span>
  </div>
  <div class="modal-view">
    <div class="modal-images" id="modal-images"></div>
    <div class="code" id="modal-code"></div>
  </div>
</dialog>
<script>
  const root = document.documentElement
  const button = document.getElementById('toggle')
  const label = () => { button.textContent = root.dataset.theme == 'dark' ? '☀ light' : '☾ dark' }
  const saved = localStorage.getItem('gum-report-theme')
  if (saved == 'light' || saved == 'dark') root.dataset.theme = saved
  label()
  button.addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme == 'dark' ? 'light' : 'dark'
    localStorage.setItem('gum-report-theme', root.dataset.theme)
    label()
  })

  const modal = document.getElementById('example-modal')
  const modalName = document.getElementById('modal-name')
  const modalStatus = document.getElementById('modal-status')
  const modalImages = document.getElementById('modal-images')
  const modalCode = document.getElementById('modal-code')
  const showCode = document.getElementById('show-code')
  const close = document.getElementById('modal-close')
  let activeCard = null

  const openExample = card => {
    const name = card.querySelector('.name')
    const status = card.querySelector('.status')
    const code = card.querySelector('.code-template')

    activeCard = card
    modalName.textContent = name.textContent
    modalStatus.textContent = status.textContent
    modalStatus.className = status.className
    modalImages.replaceChildren(...[...card.querySelectorAll('.image')].map(image => image.cloneNode(true)))
    modalCode.replaceChildren(code.content.cloneNode(true))
    showCode.checked = false
    modal.classList.remove('show-code')
    modal.showModal()
    close.focus()
  }

  for (const card of document.querySelectorAll('.card')) {
    card.addEventListener('click', () => openExample(card))
    card.addEventListener('keydown', event => {
      if (event.key != 'Enter' && event.key != ' ') return
      event.preventDefault()
      openExample(card)
    })
  }

  showCode.addEventListener('change', () => modal.classList.toggle('show-code', showCode.checked))
  close.addEventListener('click', () => modal.close())
  modal.addEventListener('click', event => {
    if (event.target == modal) modal.close()
  })
  modal.addEventListener('close', () => {
    modalImages.replaceChildren()
    modalCode.replaceChildren()
    activeCard?.focus()
    activeCard = null
  })
</script>
</body>
</html>
