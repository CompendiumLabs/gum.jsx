<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>gum.jsx test report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1a;
    color: #ddd;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.5rem; }
  h2 {
    font-size: 1.1rem; font-weight: 600; margin: 2rem 0 1rem;
    padding-bottom: 0.4rem; border-bottom: 1px solid #333;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  .summary { color: #999; margin-bottom: 1rem; }
  .summary .pass { color: #6c6; }
  .summary .fail { color: #e66; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
  }
  .card {
    background: #222;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card.fail { border-color: #a44; }
  .head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.5rem 0.75rem; border-bottom: 1px solid #333;
  }
  .name {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.85rem;
  }
  .status {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
    padding: 0.15rem 0.5rem; border-radius: 999px;
  }
  .status.pass { background: #1d3a1d; color: #6c6; }
  .status.fail { background: #3a1d1d; color: #e66; }
  .image {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 1rem; min-height: 12rem;
  }
  .image img { max-width: 100%; max-height: 16rem; }
  .error {
    color: #e66; padding: 1rem;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.8rem; white-space: pre-wrap; word-break: break-word;
  }
  details { border-top: 1px solid #333; }
  details summary {
    padding: 0.4rem 0.75rem; cursor: pointer;
    color: #888; font-size: 0.75rem; user-select: none;
  }
  details pre {
    padding: 0.75rem; overflow-x: auto; background: #1d1d1d;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.75rem; line-height: 1.5; color: #bbb;
  }
</style>
</head>
<body>
<h1>gum.jsx test report</h1>
<p class="summary">{{summary}}</p>
{{sections}}
</body>
</html>
